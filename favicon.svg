<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="tdG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="48%" stop-color="#4e86f5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="tdCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="tdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark glass capsule background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f111a" stroke="url(#tdG1)" stroke-width="2.2" />

  <!-- Holographic Shield Polygon -->
  <path d="M32 9 L53 19 V39 C53 49 42 56 32 59 C22 56 11 49 11 39 V19 Z" fill="url(#tdG1)" fill-opacity="0.14" stroke="url(#tdG1)" stroke-width="2.4" stroke-linejoin="round" filter="url(#tdGlow)" />

  <!-- Futuristic Cloud-Hyperdrive Emblem -->
  <!-- Cloud arc -->
  <path d="M22 26 C19 26 17 28 17 31 C17 34 19 36 22 36 H42 C45 36 47 34 47 31 C47 28 45 26 42 26 C42 22 38 19 33 20 C29 19 25 22 24 25" stroke="url(#tdCore)" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Speed Data Vector (TeleDrive arrow) -->
  <path d="M32 28 V46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M24 39 L32 47 L40 39" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Energy Pulses -->
  <circle cx="32" cy="24" r="2.5" fill="#00e5ff" />
  <circle cx="17" cy="31" r="1.5" fill="#a855f7" />
  <circle cx="47" cy="31" r="1.5" fill="#a855f7" />
</svg>
