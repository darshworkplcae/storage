<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask Base Gradient (Spherical Depth) -->
    <radialGradient id="obitoGlow" cx="42%" cy="36%" r="58%">
      <stop offset="0%" stop-color="#ff9d3b" />
      <stop offset="35%" stop-color="#ff6a00" />
      <stop offset="72%" stop-color="#df4800" />
      <stop offset="95%" stop-color="#b02e00" />
      <stop offset="100%" stop-color="#7a1a00" />
    </radialGradient>

    <!-- Outer Rim Bevel -->
    <linearGradient id="obitoRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa54f" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8a2300" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#300a00" stop-opacity="0.95" />
    </linearGradient>

    <!-- Sharingan Red Glow -->
    <radialGradient id="sharingan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a2e" />
      <stop offset="45%" stop-color="#d60017" />
      <stop offset="85%" stop-color="#70000a" />
      <stop offset="100%" stop-color="#150002" />
    </radialGradient>

    <!-- Drop Shadow for 3D Mask -->
    <filter id="obitoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <clipPath id="maskClip">
      <path d="M 50 7 C 72 7, 87 23, 86 48 C 85 69, 70 89, 50 93 C 30 89, 15 69, 14 48 C 13 23, 28 7, 50 7 Z" />
    </clipPath>
  </defs>

  <!-- Mask Base with Shadow -->
  <path d="M 50 7 C 72 7, 87 23, 86 48 C 85 69, 70 89, 50 93 C 30 89, 15 69, 14 48 C 13 23, 28 7, 50 7 Z" 
        fill="url(#obitoGlow)" 
        stroke="url(#obitoRim)" 
        stroke-width="2.2" 
        filter="url(#obitoShadow)" />

  <!-- Mask Inner Spiral Ripples (Clipped to Mask Boundary) -->
  <g clip-path="url(#maskClip)">
    <!-- Ambient 3D shading layer -->
    <path d="M 14 48 C 13 23, 28 7, 50 7 C 35 15, 20 32, 22 55 C 24 73, 38 88, 50 93 C 30 89, 15 69, 14 48 Z" fill="#000000" opacity="0.18" />

    <!-- ── Kamui Spiral Ridge Highlights (Molded 3D effect) ── -->
    <g fill="none" stroke="#ffa34d" stroke-width="1.3" opacity="0.45" stroke-linecap="round">
      <!-- Spiral 1 highlight -->
      <path d="M 61 31.5 C 57 28.5, 48 30, 44.5 37 C 40.5 45, 44 54, 52 57 C 62 61, 71 55, 73.5 44 C 75.5 34, 69 24, 59 20 C 47 15, 33 21, 26 33 C 18 47, 21 64, 31 75 C 41 85, 57 88, 70 82" />
      <!-- Spiral 2 highlight -->
      <path d="M 64.5 33.5 C 62 25, 52 19, 41 21 C 29 23, 19 35, 17 49 C 15 65, 27 80, 43 86 C 59 91, 75 83, 81 68" />
      <!-- Spiral 3 highlight -->
      <path d="M 58 45.5 C 53 54, 45 64, 38 72 C 30 80, 24 83, 21 82" />
      <path d="M 65 44 C 71 52, 77 62, 79 73" />
      <path d="M 62 26 C 58 16, 50 11, 41 10 C 31 10, 24 15, 19 23" />
    </g>

    <!-- ── Kamui Spiral Black Grooves (Iconic Tobi Vortex Lines) ── -->
    <g fill="none" stroke="#160802" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Innermost swirl circling the eye -->
      <path d="M 61.5 33 C 58.5 30, 51 31.5, 47.5 37.5 C 43.5 44.5, 46.5 53, 53.5 56 C 62.5 59.5, 70.5 54, 72.5 44.5 C 74.5 35, 68.5 25.5, 59.5 21.5 C 48 16.5, 34.5 22, 27.5 33.5 C 19.5 47, 22.5 63.5, 32 74 C 41.5 83.5, 56.5 87, 69 81" />

      <!-- Outer vortex arm 1: Over forehead & around left temple -->
      <path d="M 64 35 C 61.5 26.5, 52.5 20.5, 42 22.5 C 30.5 24.5, 20.5 36, 18.5 49.5 C 16.5 65, 28 79.5, 43.5 85.5 C 58.5 90.5, 74 83, 80 68.5" />

      <!-- Outer vortex arm 2: Deep brow to crown -->
      <path d="M 61 27 C 57.5 17.5, 50 12, 41 11 C 31 11, 23.5 16, 18.5 24" />

      <!-- Outer vortex arm 3: Crown crest sweep -->
      <path d="M 65 24 C 64 15, 58 9, 50 8" />

      <!-- Vortex arm 4: Cheek ridge sweeping to chin -->
      <path d="M 57.5 45 C 52 53.5, 44 63.5, 37 71.5 C 29.5 79.5, 23 82.5, 20 81.5" />

      <!-- Vortex arm 5: Right jawline arc -->
      <path d="M 65 43.5 C 71 51, 77 61, 78.5 71.5 C 79.5 78, 76 83, 70 86" />

      <!-- Vortex arm 6: Right temple curve -->
      <path d="M 68 39 C 75 39, 81 44, 83.5 52 C 85.5 59, 84.5 66, 81.5 73" />
    </g>

    <!-- Deep Groove Shadows (Layered for authentic hand-crafted mask grooves) -->
    <g fill="none" stroke="#3b1102" stroke-width="1.0" opacity="0.65" stroke-linecap="round">
      <path d="M 61.5 33.8 C 58.5 30.8, 51 32.3, 47.5 38.3 C 43.5 45.3, 46.5 53.8, 53.5 56.8" />
      <path d="M 64 35.8 C 61.5 27.3, 52.5 21.3, 42 23.3 C 30.5 25.3, 20.5 36.8, 18.5 50.3" />
      <path d="M 57.5 45.8 C 52 54.3, 44 64.3, 37 72.3" />
    </g>
  </g>

  <!-- ── The Right Eye Hole (The Vortex Epicenter) ── -->
  <!-- Outer Eye Cutout Rim (Carved mask rim shadow) -->
  <ellipse cx="60.5" cy="38.5" rx="7.2" ry="6.2" fill="#2d0b00" />
  <ellipse cx="60.5" cy="38.5" rx="6.2" ry="5.2" fill="#08080c" />

  <!-- Inside Eye Hole: Sharingan Eye -->
  <!-- Crimson Iris -->
  <ellipse cx="60.5" cy="38.5" rx="4.6" ry="4.2" fill="url(#sharingan)" />

  <!-- Black Iris Ring -->
  <circle cx="60.5" cy="38.5" r="3.2" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.8" />

  <!-- Sharingan Pupil -->
  <circle cx="60.5" cy="38.5" r="1.6" fill="#08080c" />

  <!-- Sharingan Tomoe 1 -->
  <circle cx="60.5" cy="36.0" r="0.75" fill="#050508" />
  <path d="M 60.5 36.0 C 61.2 35.7, 61.8 36.3, 61.4 36.8" fill="none" stroke="#050508" stroke-width="0.5" stroke-linecap="round" />

  <!-- Sharingan Tomoe 2 -->
  <circle cx="58.7" cy="39.8" r="0.75" fill="#050508" />
  <path d="M 58.7 39.8 C 58.3 40.5, 58.9 41.0, 59.4 40.7" fill="none" stroke="#050508" stroke-width="0.5" stroke-linecap="round" />

  <!-- Sharingan Tomoe 3 -->
  <circle cx="62.3" cy="39.8" r="0.75" fill="#050508" />
  <path d="M 62.3 39.8 C 62.8 40.3, 62.5 41.0, 61.9 40.7" fill="none" stroke="#050508" stroke-width="0.5" stroke-linecap="round" />

  <!-- Glint / Catchlight on Sharingan -->
  <circle cx="59.3" cy="37.2" r="0.8" fill="#ffffff" opacity="0.85" />
</svg>
