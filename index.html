<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleDrive</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=obito">
  <link rel="alternate icon" href="favicon.svg?v=obito">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <script>
    (function(){
      var t = localStorage.getItem('td_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     LOGIN PAGE — shown to ALL unauthenticated visitors
     Hidden only after successful login
═══════════════════════════════════════════════════════════ -->
<div id="loginPage" class="login-fullpage" style="display:none">
  <div class="lp-bg">
    <div class="lp-blob b1"></div>
    <div class="lp-blob b2"></div>
    <div class="lp-blob b3"></div>
    <div class="lp-blob b4"></div>
    <div class="lp-blob b5"></div>
  </div>

  <div class="lp-card">
    <button class="lp-close-btn" onclick="hideSignInModal()" title="Close"><i class="fas fa-times"></i></button>
    <!-- Logo -->
    <div class="lp-logo">
      <div class="lp-logo-icon"><img src="favicon.svg?v=obito" alt="Obito Mask Logo" style="width:48px;height:48px;display:block"></div>
      <h1 class="lp-title">TeleDrive</h1>
      <p class="lp-sub">Your personal cloud storage</p>
    </div>

    <!-- Error -->
    <div id="lpErr" class="lp-err hidden"></div>

    <!-- User Login Form -->
    <div id="lpUserForm">
      <div class="lp-field">
        <i class="fas fa-user lp-field-icon"></i>
        <input class="lp-inp" id="lpUser" type="text" placeholder="Username" autocomplete="username">
      </div>
      <div class="lp-field">
        <i class="fas fa-lock lp-field-icon"></i>
        <input class="lp-inp" id="lpPass" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="lp-btn" id="lpLoginBtn" onclick="doUserLogin()">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </div>

    <!-- Footer: hidden admin link -->
    <div class="lp-footer">
      <a href="#/admin" class="lp-admin-link" onclick="showAdminLogin(event)">
        <i class="fas fa-shield-halved"></i> Admin
      </a>
    </div>
  </div>

  <!-- Admin Login overlay (inside login page, shown on #/admin) -->
  <div id="adminLoginOverlay" class="admin-login-overlay hidden">
    <div class="lp-card admin-card">
      <div class="lp-logo">
        <div class="lp-logo-icon admin"><i class="fas fa-shield-halved"></i></div>
        <h1 class="lp-title">Admin Login</h1>
        <p class="lp-sub">Restricted access</p>
      </div>
      <div id="adminErr" class="lp-err hidden"></div>
      <div class="lp-field">
        <i class="fas fa-lock lp-field-icon"></i>
        <input class="lp-inp" id="adminPassInp" type="password" placeholder="Admin password" autocomplete="current-password">
      </div>
      <button class="lp-btn admin-btn" id="adminLoginBtn" onclick="doAdminLogin()">
        <i class="fas fa-shield-halved"></i> Admin Login
      </button>
      <button class="lp-back-btn" onclick="hideAdminLogin()">
        <i class="fas fa-arrow-left"></i> Back to user login
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     APP SHELL — ready by default with zero login flash
═══════════════════════════════════════════════════════════ -->
<div id="appShell" class="app-shell" style="display:flex">

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>
  <aside class="sidebar" id="appSidebar">
    <div class="sb-logo" onclick="navTo('files')">
      <div class="sb-logo-icon"><img src="favicon.svg?v=obito" alt="Obito Mask Logo" style="width:30px;height:30px;display:block"></div>
      <span class="sb-logo-txt">TeleDrive</span>
    </div>

    <div class="sb-profile" id="sbProfile">
      <div class="sb-avatar" id="sbAvatar">?</div>
      <div class="sb-pinfo">
        <div class="sb-pname" id="sbName">User</div>
        <div class="sb-pemail" id="sbRole">Loading…</div>
      </div>
      <button class="icon-btn xs" onclick="toggleSbMenu()"><i class="fas fa-ellipsis-v"></i></button>
      <div class="sb-pmenu hidden" id="sbMenu">
        <div class="pmenu-item admin-only hidden" onclick="navTo('settings')"><i class="fas fa-gear"></i> Settings</div>
        <div class="pmenu-item" onclick="toggleTheme()"><i class="fas fa-circle-half-stroke"></i> Switch Theme</div>
        <div class="pmenu-item danger user-or-admin hidden" id="pmenuLogout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
        <div class="pmenu-item guest-only" id="pmenuLogin" onclick="showSignInModal()"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-nav-item" data-page="files"     onclick="navTo('files')">    <i class="fas fa-folder-open"></i><span>All Files</span></div>
      <div class="sb-nav-item user-or-admin hidden" data-page="quota" onclick="navTo('quota')"><i class="fas fa-chart-pie"></i><span>Quota Tracker</span></div>
      <div class="sb-nav-item" data-page="recent"    onclick="navTo('recent')">   <i class="fas fa-clock-rotate-left"></i><span>Recent</span></div>
      <div class="sb-nav-item" data-page="starred"   onclick="navTo('starred')">  <i class="fas fa-star"></i><span>Starred</span></div>
      <div class="sb-nav-item" data-page="trash"     onclick="navTo('trash')">    <i class="fas fa-trash-can"></i><span>Recycle Bin</span></div>
      <div class="sb-divider"></div>
      <div class="sb-nav-item admin-only hidden" data-page="activity"  onclick="navTo('activity')"> <i class="fas fa-list-ul"></i><span>Activity Log</span></div>
      <div class="sb-nav-item admin-only hidden" data-page="settings"  onclick="navTo('settings')"> <i class="fas fa-gear"></i><span>Setting</span></div>
      <div class="sb-nav-item admin-only hidden" data-page="apikeys"   onclick="navTo('apikeys')">  <i class="fas fa-key"></i><span>API Keys</span></div>
    </nav>

    <div class="sb-storage user-or-admin hidden" id="sbStorage">
      <div class="sb-storage-rows" id="sbStorageRows"></div>
      <div class="sb-quota-bar"><div class="sb-quota-fill" id="sbQuotaFill"></div></div>
      <div class="sb-quota-txt" id="sbQuotaTxt"><span>—</span><span>—</span></div>
    </div>

    <button class="sb-logout hidden" id="sbLogout" onclick="doLogout()">
      <i class="fas fa-sign-out-alt"></i> Log Out
    </button>
    <button class="sb-logout guest-only" id="sbLoginBtn" onclick="showSignInModal()" style="background:linear-gradient(135deg,rgba(78,134,245,0.2),rgba(121,40,202,0.2));color:var(--primary);border:1px solid rgba(78,134,245,0.3)">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign In
    </button>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileSidebar()" title="Toggle Menu"><i class="fas fa-bars"></i></button>
        <div id="breadcrumb" class="breadcrumb"><span class="bc-item active">All Files</span></div>
      </div>
      <div class="topbar-search">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="globalSearch" placeholder="Search…">
        <kbd class="search-kbd" id="searchKbd">Ctrl+K</kbd>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost sm guest-only" id="guestSignInBtn" onclick="showSignInModal()"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>
        <div class="layout-toggle-btns" title="Switch layout">
          <button class="vsz active" id="btnGridView" onclick="setLayoutMode(false)" title="Grid View"><i class="fas fa-grip"></i></button>
          <button class="vsz" id="btnListView" onclick="setLayoutMode(true)" title="List View"><i class="fas fa-list"></i></button>
        </div>
        <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light / Dark Theme">
          <i class="fas fa-sun" id="themeIcon"></i>
        </button>
        <div class="upload-group" style="display:flex;gap:6px">
          <button class="btn-primary sm hidden" id="uploadBtn"><i class="fas fa-cloud-arrow-up"></i> Upload Files</button>
          <button class="btn-ghost sm hidden" id="folderUpBtn"><i class="fas fa-folder-arrow-up"></i> Upload Folder</button>
        </div>
        <button class="btn-ghost sm hidden" id="newFolderBtn"><i class="fas fa-folder-plus"></i> New Folder</button>
        <button class="btn-ghost sm hidden" id="syncBtn"><i class="fas fa-rotate"></i></button>
        <div class="tb-divider"></div>
        <div class="tm-btn-wrap">
          <button class="icon-btn tm-network-btn" id="tmBtn" onclick="toggleTMPanel()" title="Transfers & Live Network Speed">
            <i class="fas fa-arrow-right-arrow-left" id="tmIcon"></i>
            <span class="tm-badge" id="tmBadge"></span>
            <span class="tm-live-speed" id="tmLiveSpeed"></span>
          </button>
        </div>
        <button class="icon-btn hidden" id="adminQuickBtn" onclick="navTo('settings')" title="Admin Panel">
          <i class="fas fa-shield-halved" style="color:var(--primary)"></i>
        </button>
      </div>
    </header>

    <div class="page-content" id="pageContent">
      <div class="loading-full"><i class="fas fa-spinner fa-spin"></i><span>Loading…</span></div>
    </div>

    <!-- Multi-Select Floating Bar -->
    <div class="multi-select-bar hidden" id="multiSelectBar">
      <div class="ms-left">
        <span class="ms-count-badge"><i class="fas fa-check-circle"></i> <span id="msCount">0</span> selected</span>
      </div>
      <div class="ms-actions">
        <button class="btn-ghost sm" onclick="selectAllCurrentFiles()"><i class="fas fa-check-double"></i> Select All</button>
        <button class="btn-ghost sm" onclick="clearFileSelection()"><i class="fas fa-times"></i> Clear</button>
        <button class="btn-danger sm" onclick="deleteSelectedFiles()"><i class="fas fa-trash-alt"></i> Delete Selected</button>
      </div>
    </div>

    <!-- Mobile Floating Action Button (FAB) for fast mobile uploading -->
    <div class="mobile-fab-wrap" id="mobileFabWrap">
      <div class="mobile-fab-menu hidden" id="mobileFabMenu">
        <button class="fab-menu-item" onclick="triggerMobileUploadFiles()"><i class="fas fa-cloud-arrow-up"></i> Upload Photos / Videos</button>
        <button class="fab-menu-item" onclick="triggerMobileUploadFolder()"><i class="fas fa-folder-arrow-up"></i> Upload Folder</button>
        <button class="fab-menu-item" onclick="showNewFolderDialog(); toggleMobileFab(false)"><i class="fas fa-folder-plus"></i> New Folder</button>
      </div>
      <button class="mobile-fab-btn" id="mobileFabBtn" onclick="toggleMobileFab()" title="Upload & New">
        <i class="fas fa-plus"></i>
      </button>
    </div>

    <!-- Transfer Manager Backdrop & Panel (Full viewport scope, never cut off) -->
    <div class="tm-backdrop hidden" id="tmBackdrop" onclick="toggleTMPanel(false)"></div>
    <div class="tm-panel hidden" id="tmPanel">
      <div class="tm-sheet-handle"></div>
      <div class="tm-hd">
        <div class="tm-title-wrap">
          <i class="fas fa-arrow-right-arrow-left" style="color:var(--primary);margin-right:6px"></i>
          <span>Transfers & Network</span>
          <span class="tm-hd-speed" id="tmHdSpeed"></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn-ghost xs" id="tmClear" onclick="tmClear()" title="Clear finished">Clear</button>
          <button class="icon-btn xs tm-close-btn" onclick="toggleTMPanel(false)" title="Close transfers"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div id="tmList" class="tm-list"></div>
    </div>

    <div class="up-bar hidden" id="upBar">
      <div class="up-inner">
        <i class="fas fa-cloud-arrow-up up-ico"></i>
        <div class="up-info">
          <div class="up-name" id="upName">Uploading…</div>
          <div class="up-status" id="upStatus"></div>
        </div>
        <div class="up-track-wrap">
          <div class="up-track"><div class="up-fill" id="upFill"></div></div>
          <span class="up-pct" id="upPct">0%</span>
        </div>
                <button class="icon-btn" id="upPauseBtn" title="Pause / Resume"><i class="fas fa-pause"></i></button>
        <button class="icon-btn" id="upCancelBtn" title="Cancel"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" multiple hidden webkitdirectory directory>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/router.js"></script>
<script src="js/render.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
