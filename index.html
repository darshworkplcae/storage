<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleDrive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     LOGIN PAGE — shown to ALL unauthenticated visitors
     Hidden only after successful login
═══════════════════════════════════════════════════════════ -->
<div id="loginPage" class="login-fullpage">
  <div class="lp-bg">
    <div class="lp-blob b1"></div>
    <div class="lp-blob b2"></div>
    <div class="lp-blob b3"></div>
  </div>

  <div class="lp-card">
    <!-- Logo -->
    <div class="lp-logo">
      <div class="lp-logo-icon"><i class="fas fa-hard-drive"></i></div>
      <h1 class="lp-title">TeleDrive</h1>
      <p class="lp-sub">Your personal cloud storage</p>
    </div>

    <!-- Error -->
    <div id="lpErr" class="lp-err hidden"></div>

    <!-- User Login Form -->
    <div id="lpUserForm">
      <div class="lp-field">
        <i class="fas fa-user lp-field-icon"></i>
        <input class="lp-inp" id="lpUser" type="text" placeholder="Username" autocomplete="username">
      </div>
      <div class="lp-field">
        <i class="fas fa-lock lp-field-icon"></i>
        <input class="lp-inp" id="lpPass" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="lp-btn" id="lpLoginBtn" onclick="doUserLogin()">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </div>

    <!-- Footer: hidden admin link -->
    <div class="lp-footer">
      <a href="#/admin" class="lp-admin-link" onclick="showAdminLogin(event)">
        <i class="fas fa-shield-halved"></i> Admin
      </a>
    </div>
  </div>

  <!-- Admin Login overlay (inside login page, shown on #/admin) -->
  <div id="adminLoginOverlay" class="admin-login-overlay hidden">
    <div class="lp-card admin-card">
      <div class="lp-logo">
        <div class="lp-logo-icon admin"><i class="fas fa-shield-halved"></i></div>
        <h1 class="lp-title">Admin Login</h1>
        <p class="lp-sub">Restricted access</p>
      </div>
      <div id="adminErr" class="lp-err hidden"></div>
      <div class="lp-field">
        <i class="fas fa-lock lp-field-icon"></i>
        <input class="lp-inp" id="adminPassInp" type="password" placeholder="Admin password" autocomplete="current-password">
      </div>
      <button class="lp-btn admin-btn" id="adminLoginBtn" onclick="doAdminLogin()">
        <i class="fas fa-shield-halved"></i> Admin Login
      </button>
      <button class="lp-back-btn" onclick="hideAdminLogin()">
        <i class="fas fa-arrow-left"></i> Back to user login
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     APP SHELL — hidden until login, then revealed
═══════════════════════════════════════════════════════════ -->
<div id="appShell" class="app-shell" style="display:none">

  <aside class="sidebar">
    <div class="sb-logo" onclick="navTo('files')">
      <div class="sb-logo-icon"><i class="fas fa-hard-drive"></i></div>
      <span class="sb-logo-txt">TeleDrive</span>
    </div>

    <div class="sb-profile" id="sbProfile">
      <div class="sb-avatar" id="sbAvatar">?</div>
      <div class="sb-pinfo">
        <div class="sb-pname" id="sbName">User</div>
        <div class="sb-pemail" id="sbRole">Loading…</div>
      </div>
      <button class="icon-btn xs" onclick="toggleSbMenu()"><i class="fas fa-ellipsis-v"></i></button>
      <div class="sb-pmenu hidden" id="sbMenu">
        <div class="pmenu-item" onclick="navTo('settings')"><i class="fas fa-gear"></i> Settings</div>
        <div class="pmenu-item danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-nav-item" data-page="files"     onclick="navTo('files')">    <i class="fas fa-folder-open"></i><span>All Files</span></div>
      <div class="sb-nav-item" data-page="quota"     onclick="navTo('quota')">    <i class="fas fa-chart-pie"></i><span>Quota Tracker</span></div>
      <div class="sb-nav-item" data-page="recent"    onclick="navTo('recent')">   <i class="fas fa-clock-rotate-left"></i><span>Recent</span></div>
      <div class="sb-nav-item" data-page="starred"   onclick="navTo('starred')">  <i class="fas fa-star"></i><span>Starred</span></div>
      <div class="sb-nav-item" data-page="trash"     onclick="navTo('trash')">    <i class="fas fa-trash-can"></i><span>Recycle Bin</span></div>
      <div class="sb-divider"></div>
      <div class="sb-nav-item admin-only hidden" data-page="activity"  onclick="navTo('activity')"> <i class="fas fa-list-ul"></i><span>Activity Log</span></div>
      <div class="sb-nav-item admin-only hidden" data-page="settings"  onclick="navTo('settings')"> <i class="fas fa-gear"></i><span>Setting</span></div>
      <div class="sb-nav-item admin-only hidden" data-page="apikeys"   onclick="navTo('apikeys')">  <i class="fas fa-key"></i><span>API Keys</span></div>
    </nav>

    <div class="sb-storage" id="sbStorage">
      <div class="sb-storage-rows" id="sbStorageRows"></div>
      <div class="sb-quota-bar"><div class="sb-quota-fill" id="sbQuotaFill"></div></div>
      <div class="sb-quota-txt" id="sbQuotaTxt"><span>—</span><span>—</span></div>
    </div>

    <button class="sb-logout" onclick="doLogout()">
      <i class="fas fa-sign-out-alt"></i> Log Out
    </button>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div id="breadcrumb" class="breadcrumb"><span class="bc-item active">All Files</span></div>
      </div>
      <div class="topbar-search">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="globalSearch" placeholder="Search Documents… (Ctrl+K)">
      </div>
      <div class="topbar-right">
        <div class="view-size-btns" title="XS=tiny grid  SM=small  MD=medium  LG=large cards">
          <button class="vsz" data-sz="xs" onclick="setGridSize('xs')">XS</button>
          <button class="vsz" data-sz="sm" onclick="setGridSize('sm')">SM</button>
          <button class="vsz active" data-sz="md" onclick="setGridSize('md')">MD</button>
          <button class="vsz" data-sz="lg" onclick="setGridSize('lg')">LG</button>
        </div>
        <div class="upload-group">
          <button class="btn-primary sm hidden" id="uploadBtn"><i class="fas fa-upload"></i> Upload</button>
          <button class="btn-ghost sm hidden icon-btn" id="folderUpBtn" title="Upload Folder"><i class="fas fa-folder-arrow-up"></i></button>
        </div>
        <button class="btn-ghost sm hidden" id="newFolderBtn"><i class="fas fa-folder-plus"></i> New Folder</button>
        <button class="btn-ghost sm hidden" id="syncBtn"><i class="fas fa-rotate"></i></button>
        <div class="tb-divider"></div>
        <div class="tm-btn-wrap">
          <button class="icon-btn" id="tmBtn" title="Transfers">
            <i class="fas fa-arrow-right-arrow-left"></i>
            <span class="tm-badge" id="tmBadge"></span>
          </button>
          <div class="tm-panel hidden" id="tmPanel">
            <div class="tm-hd"><span>Transfers</span><button class="btn-ghost xs" id="tmClear">Clear</button></div>
            <div id="tmList" class="tm-list"></div>
          </div>
        </div>
        <button class="icon-btn hidden" id="adminQuickBtn" onclick="navTo('settings')" title="Admin Panel">
          <i class="fas fa-shield-halved" style="color:var(--primary)"></i>
        </button>
      </div>
    </header>

    <div class="page-content" id="pageContent">
      <div class="loading-full"><i class="fas fa-spinner fa-spin"></i><span>Loading…</span></div>
    </div>

    <div class="up-bar hidden" id="upBar">
      <div class="up-inner">
        <i class="fas fa-cloud-arrow-up up-ico"></i>
        <div class="up-info">
          <div class="up-name" id="upName">Uploading…</div>
          <div class="up-status" id="upStatus"></div>
        </div>
        <div class="up-track-wrap">
          <div class="up-track"><div class="up-fill" id="upFill"></div></div>
          <span class="up-pct" id="upPct">0%</span>
        </div>
        <button class="icon-btn" id="upCancelBtn"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" multiple hidden webkitdirectory>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/router.js"></script>
<script src="js/render.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
