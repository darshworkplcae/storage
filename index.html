<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleDrive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Ambient background -->
  <div class="bg-canvas">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>
  </div>

  <div id="app">
    <!-- ── Top Bar ── -->
    <header class="top-bar">
      <div class="tb-left">
        <div class="logo" onclick="goHome()">
          <i class="fas fa-hard-drive"></i>
          <span>TeleDrive</span>
        </div>
        <button class="icon-btn tb-btn hidden" id="homeBreadBtn" onclick="goHome()" title="Home">
          <i class="fas fa-house"></i>
        </button>
        <button class="icon-btn tb-btn" id="navBack" title="Back"><i class="fas fa-chevron-left"></i></button>
        <button class="icon-btn tb-btn" id="navFwd" title="Forward"><i class="fas fa-chevron-right"></i></button>
        <button class="icon-btn tb-btn" id="navUp" title="Up"><i class="fas fa-arrow-up"></i></button>
      </div>
      <div class="tb-search">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="globalSearch" placeholder="Search files and drives… (Ctrl+K)">
      </div>
      <div class="tb-right">
        <div class="tm-wrap">
          <button class="icon-btn tb-btn" id="tmBtn" title="Transfers">
            <i class="fas fa-arrow-right-arrow-left"></i>
            <span class="badge-count" id="tmBadge"></span>
          </button>
          <div class="tm-panel" id="tmPanel">
            <div class="tm-hd"><span>Transfers</span><button class="btn-ghost xs" id="tmClear">Clear</button></div>
            <div class="tm-list" id="tmList"></div>
          </div>
        </div>
        <button class="icon-btn tb-btn hidden" id="logoutBtn" onclick="doLogout()" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
        <button class="icon-btn tb-btn hidden" id="adminFab" onclick="showAdminScreen()" title="Admin Panel">
          <i class="fas fa-shield-halved"></i>
        </button>
        <button class="btn-ghost xs" onclick="showLoginScreen()">Sign In</button>
      </div>
    </header>

    <div class="app-body">
      <!-- ── Home Screen ── -->
      <div id="homeScreen" class="screen">
        <div class="home-header">
          <h1>Your Drives</h1>
          <p>Fast cloud storage powered by Google Drive</p>
        </div>
        <div class="drives-grid" id="drivesGrid">
          <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><span>Loading…</span></div>
        </div>
      </div>

      <!-- ── Explorer View ── -->
      <div id="explorerView" class="screen hidden">
        <div class="ex-sidebar" id="exSidebar">
          <div class="sb-section">
            <div class="sb-label">QUICK ACCESS</div>
            <div id="sidebarTree"></div>
          </div>
        </div>
        <div class="ex-main">
          <!-- Toolbar -->
          <div class="toolbar">
            <div class="addr-bar" id="addrBar"></div>
            <div class="tb-actions">
              <button class="btn-p sm" id="uploadBtn"><i class="fas fa-upload"></i> Upload</button>
              <button class="btn-ghost sm" id="newFolderBtn"><i class="fas fa-folder-plus"></i> New Folder</button>
              <div class="divider-v"></div>
              <div class="filter-tabs">
                <button class="ftab active" data-filter="all">All</button>
                <button class="ftab" data-filter="image"><i class="fas fa-image"></i></button>
                <button class="ftab" data-filter="video"><i class="fas fa-film"></i></button>
                <button class="ftab" data-filter="audio"><i class="fas fa-music"></i></button>
                <button class="ftab" data-filter="doc"><i class="fas fa-file-lines"></i></button>
                <button class="ftab" data-filter="archive"><i class="fas fa-file-zipper"></i></button>
                <input class="inp xs" id="extInput" placeholder=".ext">
              </div>
              <div class="divider-v"></div>
              <select class="inp xs" id="sortSelect">
                <option value="name">Name</option>
                <option value="date">Date</option>
                <option value="size">Size</option>
              </select>
              <button class="icon-btn active" id="viewGrid" title="Grid"><i class="fas fa-grip"></i></button>
              <button class="icon-btn" id="viewList" title="List"><i class="fas fa-list"></i></button>
            </div>
          </div>
          <!-- Content -->
          <div class="ex-content" id="exContent">
            <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><span>Loading…</span></div>
          </div>
          <!-- Status bar -->
          <div class="status-bar" id="statusBar"></div>
        </div>
      </div>

      <!-- ── Admin Screen ── -->
      <div id="adminScreen" class="screen hidden"></div>

      <!-- ── Auth Screen ── -->
      <div id="authScreen" class="screen hidden"></div>
    </div>
  </div>

  <!-- Upload progress bar -->
  <div class="up-bar hidden" id="upBar">
    <div class="up-inner">
      <i class="fas fa-cloud-arrow-up up-ico"></i>
      <div class="up-info">
        <div class="up-name" id="upName">Uploading…</div>
        <div class="up-status" id="upStatus"></div>
      </div>
      <div class="up-prog">
        <div class="up-track"><div class="up-fill" id="upFill"></div></div>
        <span class="up-pct" id="upPct">0%</span>
      </div>
      <button class="icon-btn" id="upCancelBtn" title="Cancel"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" multiple hidden>

  <!-- Scripts (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/router.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
